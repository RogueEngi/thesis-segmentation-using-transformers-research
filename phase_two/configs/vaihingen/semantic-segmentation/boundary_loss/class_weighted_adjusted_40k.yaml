# =============================================================================
# VAIHINGEN: ADJUSTED CLASS-WEIGHTED BOUNDARY LOSS
# =============================================================================
# Adjusted per-class weights based on analysis of class_weighted_40k results:
#
# Previous Results (class_weighted_40k, best=71.48% - NEW HIGH!):
#   - Impervious Surface (0.5): Slightly degraded, keep low
#   - Building (1.0):           Stable, keep as is
#   - Low Vegetation (1.5):     Good improvement (+1.82%), increase further
#   - Tree (1.0):               Stable, keep as is
#   - Car (1.2):                Consistent improvement (+1.48%, +1.82%), increase
#   - Clutter (0.1):            Showed potential (+11.91% at best), increase slightly
#
# Class order (after reduce_zero_label): 
#   0=impervious_surface, 1=building, 2=low_vegetation, 3=tree, 4=car, 5=clutter
#
# Strategy: Increase weights for classes that showed improvement potential
# =============================================================================

_BASE_: Base-Vaihingen-BoundaryLoss.yaml

MODEL:
  MASK_FORMER:
    BOUNDARY_WEIGHT: 10.0
    BOUNDARY_WARMUP_ITERS: 5000
    BOUNDARY_RAMPUP_ITERS: 10000  # Full weight at iter 15000
    BOUNDARY_NORMALIZE: True
    BOUNDARY_NORMALIZE_SCALE: 10.0
    # Per-class weights: [impervious_surface, building, low_vegetation, tree, car, clutter]
    # Adjusted: increase low_veg, car, and clutter based on improvement potential
    BOUNDARY_CLASS_WEIGHTS: [0.5, 1.0, 1.8, 1.0, 1.5, 0.3]

# =============================================================================
# SOLVER: 40k iterations
# =============================================================================
SOLVER:
  MAX_ITER: 40000
  CHECKPOINT_PERIOD: 2000

# =============================================================================
# TEST: Evaluate every 2k iterations
# =============================================================================
TEST:
  EVAL_PERIOD: 2000

OUTPUT_DIR: "./output/vaihingen_class_weighted_adjusted_40k"
