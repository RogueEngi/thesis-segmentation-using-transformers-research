# =============================================================================
# VAIHINGEN: SYSTEMATIC CLASS-WEIGHTED BOUNDARY LOSS
# =============================================================================
# Per-class weights derived using LINEAR NORMALIZATION based on each class's
# response to uniform boundary loss (HW_vs_Ref_Delta).
#
# Formula:
#   w_c = w_min + [(Δ_c - Δ_min) / (Δ_max - Δ_min)] × (w_max - w_min)
#
# Parameters:
#   - w_min = 0.5 (class most hurt by boundary loss)
#   - w_max = 2.0 (class most helped by boundary loss)
#   - Δ_min = -2.45% (Low_Vegetation)
#   - Δ_max = +1.92% (Car)
#
# Weight Derivation:
#   Class             | HW_vs_Ref_Δ | Normalized | Weight
#   ------------------|-------------|------------|-------
#   Impervious_Surface|   +1.23%    |    0.842   |  1.76
#   Building          |   +0.02%    |    0.565   |  1.35
#   Low_Vegetation    |   -2.45%    |    0.000   |  0.50  (min - most hurt)
#   Tree              |   -1.03%    |    0.325   |  0.99
#   Car               |   +1.92%    |    1.000   |  2.00  (max - most helped)
#   Clutter           |   +0.99%    |    0.787   |  1.68
#
# Class order: [impervious_surface, building, low_vegetation, tree, car, clutter]
# =============================================================================

_BASE_: Base-Vaihingen-BoundaryLoss.yaml

MODEL:
  MASK_FORMER:
    BOUNDARY_WEIGHT: 1.0
    BOUNDARY_WARMUP_ITERS: 5000
    BOUNDARY_RAMPUP_ITERS: 10000
    BOUNDARY_NORMALIZE: True
    BOUNDARY_NORMALIZE_SCALE: 10.0
    # Systematically derived weights: min=0.5, max=2.0
    BOUNDARY_CLASS_WEIGHTS: [1.76, 1.35, 0.5, 0.99, 2.0, 1.68]

SOLVER:
  MAX_ITER: 40000
  CHECKPOINT_PERIOD: 2000

TEST:
  EVAL_PERIOD: 2000

OUTPUT_DIR: "./output/vaihingen_systematic_weighted_40k_lw"
