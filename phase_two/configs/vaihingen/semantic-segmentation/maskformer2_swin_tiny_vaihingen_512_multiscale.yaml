# =============================================================================
# MMCV-STYLE CONFIG: Mask2Former Swin-Tiny for Vaihingen
# =============================================================================
# This config matches MMCV/MMSegmentation's training pipeline to achieve
# comparable results (~70% mIoU instead of ~48%).
#
# KEY CHANGES from previous config:
# 1. Multi-scale training (0.5x - 2.0x) - CRITICAL for performance!
# 2. Proper data augmentation pipeline matching MMCV
# 3. Backbone LR multiplier 0.1 (same as MMCV)
# 4. PolyLR scheduler (MMCV's default)
#
# MMCV achieved 70% mIoU with:
# - Swin-Tiny backbone
# - ADE20K pretrained weights
# - 6000 iterations (3k+ already at 70%)
# - Multi-scale training with ratio_range=(0.5, 2.0)
# =============================================================================

_BASE_: Base-Vaihingen-SemanticSegmentation.yaml

MODEL:
  META_ARCHITECTURE: "MaskFormer"
  WEIGHTS: "model_final_5274a6.pkl"
  
  BACKBONE:
    NAME: "D2SwinTransformer"
  SWIN:
    EMBED_DIM: 96
    DEPTHS: [2, 2, 6, 2]
    NUM_HEADS: [3, 6, 12, 24]
    WINDOW_SIZE: 7
    APE: False
    DROP_PATH_RATE: 0.3
    PATCH_NORM: True
    OUT_FEATURES: ["res2", "res3", "res4", "res5"]
  
  PIXEL_MEAN: [123.675, 116.280, 103.530]
  PIXEL_STD: [58.395, 57.120, 57.375]
  
  SEM_SEG_HEAD:
    NAME: "MaskFormerHead"
    IGNORE_VALUE: 255
    NUM_CLASSES: 6
    LOSS_WEIGHT: 1.0
    CONVS_DIM: 256
    MASK_DIM: 256
    NORM: "GN"
    PIXEL_DECODER_NAME: "MSDeformAttnPixelDecoder"
    IN_FEATURES: ["res2", "res3", "res4", "res5"]
    DEFORMABLE_TRANSFORMER_ENCODER_IN_FEATURES: ["res3", "res4", "res5"]
    COMMON_STRIDE: 4
    TRANSFORMER_ENC_LAYERS: 6
    
  MASK_FORMER:
    TRANSFORMER_DECODER_NAME: "MultiScaleMaskedTransformerDecoder"
    TRANSFORMER_IN_FEATURE: "multi_scale_pixel_decoder"
    DEEP_SUPERVISION: True
    NO_OBJECT_WEIGHT: 0.1
    CLASS_WEIGHT: 2.0
    MASK_WEIGHT: 5.0
    DICE_WEIGHT: 5.0
    BOUNDARY_WEIGHT: 0.0
    HIDDEN_DIM: 256
    NUM_OBJECT_QUERIES: 100
    NHEADS: 8
    DROPOUT: 0.0
    DIM_FEEDFORWARD: 2048
    ENC_LAYERS: 0
    PRE_NORM: False
    ENFORCE_INPUT_PROJ: False
    SIZE_DIVISIBILITY: 32
    DEC_LAYERS: 10
    TRAIN_NUM_POINTS: 12544
    OVERSAMPLE_RATIO: 3.0
    IMPORTANCE_SAMPLE_RATIO: 0.75
    TEST:
      SEMANTIC_ON: True
      INSTANCE_ON: False
      PANOPTIC_ON: False
      OVERLAP_THRESHOLD: 0.8
      OBJECT_MASK_THRESHOLD: 0.8

# =============================================================================
# SOLVER: Match MMCV settings
# =============================================================================
SOLVER:
  # Reduced batch size for 4GB GPU with multi-scale training
  IMS_PER_BATCH: 2
  
  # Base LR: 5e-5 (same as MMCV)
  # Scaled for batch size: 5e-5 * (2/16) * 8 = 5e-5
  BASE_LR: 0.00005
  
  # Backbone learns 10x slower (same as MMCV's lr_mult=0.1)
  BACKBONE_MULTIPLIER: 0.1
  
  # PolyLR scheduler (MMCV default)
  # power=0.9 in MMCV, which is detectron2's default
  LR_SCHEDULER_NAME: "WarmupPolyLR"
  
  # Warmup:
  WARMUP_ITERS: 500
  WARMUP_FACTOR: 0.01
  
  # MMCV achieved 70% at 3k-6k iterations
  # We'll train for 10k to be safe
  MAX_ITER: 20000
  
  CHECKPOINT_PERIOD: 2000
  WEIGHT_DECAY: 0.05
  WEIGHT_DECAY_NORM: 0.0
  OPTIMIZER: "ADAMW"
  
  # Mixed precision for 4GB GPU
  AMP:
    ENABLED: True

# =============================================================================
# INPUT: MMCV-style multi-scale training (CRITICAL!)
# =============================================================================
# MMCV uses:
# - RandomResize with ratio_range=(0.5, 2.0) 
# - RandomCrop(512, 512) with cat_max_ratio=0.75
# - RandomFlip(prob=0.5)
# - PhotoMetricDistortion
#
# NOTE: For 4GB VRAM, we reduce MAX_SCALE from 2.0 to 1.5
# This still provides good scale variation while fitting in memory
# =============================================================================
INPUT:
  # Multi-scale training parameters (CRITICAL!)
  # Reduced MAX_SCALE for 4GB GPU (2.0 -> 1.5)
  MIN_SCALE: 0.5
  MAX_SCALE: 1.5
  
  # Crop settings
  CROP:
    ENABLED: True
    TYPE: "absolute"
    SIZE: (512, 512)
    SINGLE_CATEGORY_MAX_AREA: 0.75  # MMCV's cat_max_ratio
  
  # Color augmentation (like MMCV's PhotoMetricDistortion)
  COLOR_AUG_SSD: True
  
  # Use the new multi-scale dataset mapper
  DATASET_MAPPER_NAME: "mask_former_semantic_multiscale"
  
  # Inference settings
  MIN_SIZE_TEST: 512
  MAX_SIZE_TEST: 2048
  SIZE_DIVISIBILITY: 32
  FORMAT: "RGB"

# =============================================================================
# TEST: Evaluation settings
# =============================================================================
TEST:
  EVAL_PERIOD: 1000  # Frequent evaluation to catch best checkpoint
  AUG:
    ENABLED: False

DATALOADER:
  NUM_WORKERS: 4
  FILTER_EMPTY_ANNOTATIONS: True

OUTPUT_DIR: "./output/vaihingen_multiscale"
