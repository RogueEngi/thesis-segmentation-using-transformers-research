# =============================================================================
# OPTION 1+3 COMBINED: REDUCED WEIGHT + CURRICULUM LEARNING
# =============================================================================
# Combines two strategies:
#   1. Reduced weight (0.1) to prevent boundary loss from dominating
#   2. Curriculum learning (5000 iter warmup) to learn basics first
#
# This is a conservative approach that should be very stable.
# =============================================================================

_BASE_: Base-LoveDA-BoundaryLoss.yaml

MODEL:
  MASK_FORMER:
    BOUNDARY_WEIGHT: 0.1       # Reduced weight
    BOUNDARY_WARMUP_ITERS: 5000  # Enable after warmup
    BOUNDARY_NORMALIZE: False

OUTPUT_DIR: "./output/loveda_boundary_option1_3_combined"
