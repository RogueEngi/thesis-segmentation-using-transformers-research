# =============================================================================
# LOVEDA: CLASS-WEIGHTED BOUNDARY LOSS WITH HIGH WEIGHT RAMP-UP
# =============================================================================
# Per-class boundary weights based on IoU improvement analysis from
# high_weight_rampup_40k experiment (iter 9999 → iter 39999).
#
# IoU Improvements (from loveda_high_weight_iter9999_vs_39999.csv):
#   - Background:   +0.99 → weight 1.0 (baseline)
#   - Building:     +6.34 → weight 1.5 (high improvement)
#   - Road:         +4.45 → weight 1.3 (good improvement)
#   - Water:        +2.79 → weight 1.0 (moderate improvement)
#   - Barren:       +7.51 → weight 2.0 (highest improvement, needs most help)
#   - Forest:       +4.50 → weight 1.3 (good improvement)
#   - Agricultural: +2.21 → weight 1.0 (moderate improvement)
#
# Class order (after reduce_zero_label): 
#   0=background, 1=building, 2=road, 3=water, 4=barren, 5=forest, 6=agricultural
#
# Strategy: Higher weights for classes that benefited most from boundary loss
# =============================================================================

_BASE_: Base-LoveDA-BoundaryLoss.yaml

MODEL:
  MASK_FORMER:
    BOUNDARY_WEIGHT: 10.0
    BOUNDARY_WARMUP_ITERS: 5000
    BOUNDARY_RAMPUP_ITERS: 10000  # Full weight at iter 15000
    BOUNDARY_NORMALIZE: True
    BOUNDARY_NORMALIZE_SCALE: 10.0
    # Per-class weights: [background, building, road, water, barren, forest, agricultural]
    BOUNDARY_CLASS_WEIGHTS: [0.6, 1.8, 1.3, 0.9, 2.0, 1.3, 0.8]

# =============================================================================
# SOLVER: Extended to 40k iterations
# =============================================================================
SOLVER:
  MAX_ITER: 40000
  CHECKPOINT_PERIOD: 2000

# =============================================================================
# TEST: Evaluate every 2k iterations
# =============================================================================
TEST:
  EVAL_PERIOD: 2000

OUTPUT_DIR: "./output/loveda_class_weighted_boundary_40k"
