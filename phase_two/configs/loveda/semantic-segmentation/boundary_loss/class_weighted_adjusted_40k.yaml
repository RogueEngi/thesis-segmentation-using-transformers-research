# =============================================================================
# LOVEDA: ADJUSTED CLASS-WEIGHTED BOUNDARY LOSS
# =============================================================================
# Adjusted per-class weights based on analysis of class_weighted_40k results:
#
# Previous Results (class_weighted_40k, best=55.65%):
#   - Background (0.6):   Reduced too much, restore to baseline
#   - Building (1.8):     Good improvement (+8.63%), slight reduction
#   - Road (1.3):         Keep as is
#   - Water (0.9):        Stable class, restore to baseline
#   - Barren (2.0):       Still lowest IoU (34%), increase weight
#   - Forest (1.3):       Struggling (42% IoU), increase weight
#   - Agricultural (0.8): Degraded heavily (-3.14% at end), increase weight
#
# Class order (after reduce_zero_label): 
#   0=background, 1=building, 2=road, 3=water, 4=barren, 5=forest, 6=agricultural
#
# Strategy: Restore reduced weights, increase for underperforming classes
# =============================================================================

_BASE_: Base-LoveDA-BoundaryLoss.yaml

MODEL:
  MASK_FORMER:
    BOUNDARY_WEIGHT: 10.0
    BOUNDARY_WARMUP_ITERS: 5000
    BOUNDARY_RAMPUP_ITERS: 10000  # Full weight at iter 15000
    BOUNDARY_NORMALIZE: True
    BOUNDARY_NORMALIZE_SCALE: 10.0
    # Per-class weights: [background, building, road, water, barren, forest, agricultural]
    # Adjusted: restore background/water, increase barren/forest/agricultural
    BOUNDARY_CLASS_WEIGHTS: [1.0, 1.5, 1.3, 1.0, 2.5, 1.5, 1.2]

# =============================================================================
# SOLVER: 40k iterations
# =============================================================================
SOLVER:
  MAX_ITER: 40000
  CHECKPOINT_PERIOD: 2000

# =============================================================================
# TEST: Evaluate every 2k iterations
# =============================================================================
TEST:
  EVAL_PERIOD: 2000

OUTPUT_DIR: "./output/loveda_class_weighted_adjusted_40k"
