# =============================================================================
# BASE CONFIG FOR BOUNDARY LOSS EXPERIMENTS
# =============================================================================
# This is the base config for all boundary loss experiments on LoveDA.
# All boundary loss variants inherit from this file.
#
# Based on maskformer2_swin_tiny_loveda_512_multiscale.yaml but with
# BOUNDARY_WEIGHT: 0 (disabled by default - override in specific configs)
# =============================================================================

_BASE_: ../Base-LoveDA-SemanticSegmentation.yaml

MODEL:
  META_ARCHITECTURE: "MaskFormer"
  WEIGHTS: "model_final_5274a6.pkl"
  
  BACKBONE:
    NAME: "D2SwinTransformer"
  SWIN:
    EMBED_DIM: 96
    DEPTHS: [2, 2, 6, 2]
    NUM_HEADS: [3, 6, 12, 24]
    WINDOW_SIZE: 7
    APE: False
    DROP_PATH_RATE: 0.3
    PATCH_NORM: True
    OUT_FEATURES: ["res2", "res3", "res4", "res5"]
  
  PIXEL_MEAN: [123.675, 116.280, 103.530]
  PIXEL_STD: [58.395, 57.120, 57.375]
  
  SEM_SEG_HEAD:
    NAME: "MaskFormerHead"
    IGNORE_VALUE: 255
    NUM_CLASSES: 7
    LOSS_WEIGHT: 1.0
    CONVS_DIM: 256
    MASK_DIM: 256
    NORM: "GN"
    PIXEL_DECODER_NAME: "MSDeformAttnPixelDecoder"
    IN_FEATURES: ["res2", "res3", "res4", "res5"]
    DEFORMABLE_TRANSFORMER_ENCODER_IN_FEATURES: ["res3", "res4", "res5"]
    COMMON_STRIDE: 4
    TRANSFORMER_ENC_LAYERS: 6
    
  MASK_FORMER:
    TRANSFORMER_DECODER_NAME: "MultiScaleMaskedTransformerDecoder"
    TRANSFORMER_IN_FEATURE: "multi_scale_pixel_decoder"
    DEEP_SUPERVISION: True
    NO_OBJECT_WEIGHT: 0.1
    CLASS_WEIGHT: 2.0
    MASK_WEIGHT: 5.0
    DICE_WEIGHT: 5.0
    # Boundary loss disabled by default - override in specific configs
    BOUNDARY_WEIGHT: 0.0
    BOUNDARY_WARMUP_ITERS: 0
    BOUNDARY_RAMPUP_ITERS: 0
    BOUNDARY_NORMALIZE: False
    BOUNDARY_NORMALIZE_SCALE: 10.0
    HIDDEN_DIM: 256
    NUM_OBJECT_QUERIES: 100
    NHEADS: 8
    DROPOUT: 0.0
    DIM_FEEDFORWARD: 2048
    ENC_LAYERS: 0
    PRE_NORM: False
    ENFORCE_INPUT_PROJ: False
    SIZE_DIVISIBILITY: 32
    DEC_LAYERS: 10
    TRAIN_NUM_POINTS: 12544
    OVERSAMPLE_RATIO: 3.0
    IMPORTANCE_SAMPLE_RATIO: 0.75
    TEST:
      SEMANTIC_ON: True
      INSTANCE_ON: False
      PANOPTIC_ON: False
      OVERLAP_THRESHOLD: 0.8
      OBJECT_MASK_THRESHOLD: 0.8

SOLVER:
  IMS_PER_BATCH: 2
  BASE_LR: 0.00005
  BACKBONE_MULTIPLIER: 0.1
  LR_SCHEDULER_NAME: "WarmupPolyLR"
  WARMUP_ITERS: 500
  WARMUP_FACTOR: 0.01
  MAX_ITER: 20000
  CHECKPOINT_PERIOD: 2000
  WEIGHT_DECAY: 0.05
  WEIGHT_DECAY_NORM: 0.0
  OPTIMIZER: "ADAMW"
  AMP:
    ENABLED: True

INPUT:
  MIN_SCALE: 0.5
  MAX_SCALE: 1.5
  CROP:
    ENABLED: True
    TYPE: "absolute"
    SIZE: (512, 512)
    SINGLE_CATEGORY_MAX_AREA: 0.75
  COLOR_AUG_SSD: True
  DATASET_MAPPER_NAME: "mask_former_semantic_multiscale"
  MIN_SIZE_TEST: 512
  MAX_SIZE_TEST: 2048
  SIZE_DIVISIBILITY: 32
  FORMAT: "RGB"

TEST:
  EVAL_PERIOD: 1000
  AUG:
    ENABLED: False

DATALOADER:
  NUM_WORKERS: 4
  FILTER_EMPTY_ANNOTATIONS: True
