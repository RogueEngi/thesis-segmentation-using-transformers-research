# =============================================================================
# OPTION 3: CURRICULUM/DELAYED BOUNDARY LOSS (Recommended by Kervadec et al.)
# =============================================================================
# Based on Kervadec et al. "Boundary loss for highly unbalanced segmentation"
# 
# The paper recommends starting with region-based losses (Dice/CE) and gradually
# introducing boundary loss. This allows the model to first learn basic 
# segmentation before refining boundaries.
#
# Configuration:
#   - BOUNDARY_WEIGHT: 1.0 (same as before)
#   - BOUNDARY_WARMUP_ITERS: 5000 (enable after 5000 iterations / 25% of training)
#
# This should help avoid the negative loss dominating early training.
# =============================================================================

_BASE_: Base-LoveDA-BoundaryLoss.yaml

MODEL:
  MASK_FORMER:
    # Enable boundary loss with curriculum learning
    BOUNDARY_WEIGHT: 1.0
    # Start boundary loss after 5000 iterations (25% of 20k training)
    # Model learns basic segmentation first, then refines boundaries
    BOUNDARY_WARMUP_ITERS: 5000
    BOUNDARY_NORMALIZE: False

OUTPUT_DIR: "./output/loveda_boundary_option3_curriculum"
