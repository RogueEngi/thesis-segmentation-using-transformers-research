# Base config for LoveDA semantic segmentation
# Adapted for LoveDA land cover classification dataset

MODEL:
  BACKBONE:
    FREEZE_AT: 0
    NAME: "build_resnet_backbone"
  WEIGHTS: "detectron2://ImageNetPretrained/torchvision/R-50.pkl"
  PIXEL_MEAN: [123.675, 116.280, 103.530]
  PIXEL_STD: [58.395, 57.120, 57.375]
  RESNETS:
    DEPTH: 50
    STEM_OUT_CHANNELS: 64
    STRIDE_IN_1X1: False
    OUT_FEATURES: ["res2", "res3", "res4", "res5"]

DATASETS:
  TRAIN: ("loveda_sem_seg_train",)
  TEST: ("loveda_sem_seg_val",)

SOLVER:
  IMS_PER_BATCH: 2  # Reduced for 4GB GPU
  BASE_LR: 0.00005  # Scaled LR for small batch
  MAX_ITER: 40000
  WARMUP_FACTOR: 1.0
  WARMUP_ITERS: 0
  WEIGHT_DECAY: 0.05
  OPTIMIZER: "ADAMW"
  LR_SCHEDULER_NAME: "WarmupPolyLR"
  BACKBONE_MULTIPLIER: 0.1
  CLIP_GRADIENTS:
    ENABLED: True
    CLIP_TYPE: "full_model"
    CLIP_VALUE: 0.01
    NORM_TYPE: 2.0
  AMP:
    ENABLED: True

INPUT:
  MIN_SIZE_TRAIN: [256, 288, 320, 352, 384, 416, 448, 480, 512]
  MIN_SIZE_TRAIN_SAMPLING: "choice"
  MIN_SIZE_TEST: 512
  MAX_SIZE_TRAIN: 1024
  MAX_SIZE_TEST: 1024
  CROP:
    ENABLED: True
    TYPE: "absolute"
    SIZE: (512, 512)
    SINGLE_CATEGORY_MAX_AREA: 0.75  # Match MMCV cat_max_ratio=0.75
  COLOR_AUG_SSD: True
  SIZE_DIVISIBILITY: 32
  FORMAT: "RGB"
  # Use reduce_zero_label mapper: class 0 -> 255 (ignore), classes 1-6 -> 0-5
  DATASET_MAPPER_NAME: "mask_former_semantic_reduce_zero_label"

TEST:
  EVAL_PERIOD: 4000
  AUG:
    ENABLED: False
    MIN_SIZES: [256, 384, 512]
    MAX_SIZE: 1024
    FLIP: True
  # Slide inference to match MMCV's test_cfg=dict(mode='slide', ...)
  SLIDE_INFERENCE:
    ENABLED: True
    CROP_SIZE: [512, 512]
    STRIDE: [341, 341]

DATALOADER:
  FILTER_EMPTY_ANNOTATIONS: True
  NUM_WORKERS: 2

VERSION: 2
