# Mask2Former with Swin-Tiny backbone for LoveDA
# Optimized for laptop with 3050 Ti (4GB VRAM)

_BASE_: maskformer2_R50_loveda_512.yaml

MODEL:
  BACKBONE:
    NAME: "D2SwinTransformer"
  SWIN:
    EMBED_DIM: 96
    DEPTHS: [2, 2, 6, 2]
    NUM_HEADS: [3, 6, 12, 24]
    WINDOW_SIZE: 7
    APE: False
    DROP_PATH_RATE: 0.3
    PATCH_NORM: True
    OUT_FEATURES: ["res2", "res3", "res4", "res5"]
  WEIGHTS: "swin_tiny_patch4_window7_224.pkl"
  PIXEL_MEAN: [123.675, 116.280, 103.530]
  PIXEL_STD: [58.395, 57.120, 57.375]

SOLVER:
  IMS_PER_BATCH: 2        # Small batch for 4GB VRAM
  BASE_LR: 0.00005        # Scaled: 0.0001 * (2/16)
  MAX_ITER: 80000         # LoveDA is larger
  CHECKPOINT_PERIOD: 4000

INPUT:
  MIN_SIZE_TRAIN: [384, 416, 448, 480, 512]
  MIN_SIZE_TEST: 1024    # Match MMCV: scale=(1024, 1024)
  MAX_SIZE_TRAIN: 768
  MAX_SIZE_TEST: 1024    # Match MMCV: scale=(1024, 1024)
  CROP:
    SIZE: (512, 512)

TEST:
  EVAL_PERIOD: 4000

DATALOADER:
  NUM_WORKERS: 2

OUTPUT_DIR: "./output/loveda_swin_tiny"
